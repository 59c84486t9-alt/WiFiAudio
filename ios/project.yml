name: WiFiAudio
options:
  bundleIdPrefix: dev.wifiaudio
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  WiFiAudio:
    type: application
    platform: iOS
    sources: [WiFiAudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wifiaudio.receiver
        INFOPLIST_FILE: WiFiAudio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
